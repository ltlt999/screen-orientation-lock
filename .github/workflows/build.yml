name: 构建与测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 测试 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties 里写死了原开发机的 Windows JDK 路径
      # （C:/Program Files/Android/Android Studio/jbr）。那是为了让本机绕开
      # Java 26 与 AGP 不兼容的问题，在 Linux CI 上这个路径不存在，必须删掉。
      # 删掉后 Gradle 会用上面 setup-java 装好的 JDK 21。
      - name: 移除本机专属的 JDK 路径
        run: sed -i '/^org\.gradle\.java\.home/d' gradle.properties

      - name: 跑单元测试
        run: ./gradlew testDebugUnitTest --console=plain

      - name: 构建 debug 包
        run: ./gradlew assembleDebug --console=plain

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
