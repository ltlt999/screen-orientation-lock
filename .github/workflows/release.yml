name: 发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 打签名包并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 移除本机专属的 JDK 路径
        run: sed -i '/^org\.gradle\.java\.home/d' gradle.properties

      - name: 跑单元测试
        run: ./gradlew testDebugUnitTest --console=plain

      # 签名密钥从仓库 Secret 读取，绝不入库。
      # 需要在 Settings → Secrets and variables → Actions 里配置两个 Secret：
      #   KEYSTORE_BASE64     keystore/release.jks 的 base64（见 README「发布」一节）
      #   KEYSTORE_PROPERTIES keystore.properties 的完整内容
      # 没有配置时这一步跳过，后面的构建会产出未签名包——
      # 开源项目应当「没密钥也能构建」，而不是直接失败。
      #
      # 注意：这里用 env 中转而不是在 if: 里直接写 secrets.XXX。
      # GitHub 不允许在 if 条件中引用 secrets，写了会让整个 workflow 解析失败——
      # 表现为每次 push 都出现一个以文件路径为名字的失败运行，很难看出原因。
      - name: 还原签名密钥
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名密钥，将产出未签名包"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: 构建 release 包
        run: ./gradlew assembleRelease --console=plain

      - name: 重命名产物
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME="screen-orientation-lock-${GITHUB_REF_NAME}.apk"
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "是否已签名: ${{ steps.keystore.outputs.signed }}"

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
          draft: false
